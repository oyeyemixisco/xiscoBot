<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
		<link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.png') }}">
        <title>Xisco chatBot</title>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
		
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
		
		<!-- Fontawesome CSS -->
		<link rel="stylesheet" href="{{ url_for('static', filename='plugins/fontawesome/css/fontawesome.min.css') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='plugins/fontawesome/css/all.min.css') }}">
		
		<!-- Select2 CSS -->
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/select2.min.css') }}">
		
		<!-- Feathericon CSS -->
		<link rel="stylesheet" href="{{ url_for('static', filename='css/feather.css') }}">
		
		<!-- Main CSS -->
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
		
	</head>
    <body>
	
		<!-- Main Wrapper -->
		<div class="main-wrapper login-body" style="height: 100%;">
			<div class="container-fluid px-0">
    			<div class="row justify-content-center">
					<!-- Login Content -->
					<div class="col-lg-5 mx-auto lock-wrap-bg">
						<div class="login-wrapper">
							<div class="loginbox">								
								<div class="login-right">
									<div class="login-right-wrap">
										<div class="account-logo">
											<a href="#"><img src="{{ url_for('static', filename='upec.png') }}" alt=""></a>
										</div>
										<div class="user-lock-screen">
											<h2 style="color: rgb(255, 4, 4);">Hi, User</h2>
											<p style="margin-top: 20px; margin-bottom: 40px;">Chat session locked after idle, click button below to continue chat.</p>
										</div>
										<!-- Form -->
										<form action="{{ url_for('home') }}" method="get">
											<div class="input-block">
												<button class="btn btn-success btn-block" type="submit">Resume Chat <i class="fa fa-arrow-right"></i></button>
											</div>
										</form>
										<!-- /Form -->
										  
										<div class="next-sign" style="margin-top: 60px;">
											<p class="account-subtitle">Developed with ❤️ by <a href="https://www.linkedin.com/in/dare-azeez-oyeyemi-900652b0/">Oyeyemi Dare</a> </p>
											
											<!-- Social Login --> 
											<div class="social-login">
												<a href="https://www.linkedin.com/in/dare-azeez-oyeyemi-900652b0/" ><img src="{{ url_for('static', filename='img/icons/social-02.svg') }}" alt=""></a>
												<a href="https://www.linkedin.com/in/dare-azeez-oyeyemi-900652b0/" ><img src="{{ url_for('static', filename='img/icons/login-icon-01.svg') }}" alt=""></a>
												<a href="https://www.linkedin.com/in/dare-azeez-oyeyemi-900652b0/" ><img src="{{ url_for('static', filename='img/icons/login-icon-02.svg') }}" alt=""></a>
											</div>
											<!-- /Social Login -->
											
										</div>
									</div>
								</div>
							</div>
							
						</div>
					</div>
					<!-- /Login Content -->
					
				</div>
			</div>
		</div>
		<!-- /Main Wrapper -->
		<script>
    		document.getElementById("resumeChatBtn").addEventListener("click", () => {
    			window.location.href = "/home";
    		});
    	</script>
    </body>

</html>
